<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes · AlugaCar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container pb-5">
    <div class="page-header">
      <div>
        <h1 id="titulo">Clientes</h1>
        <p id="subtitulo">Cadastro de contratantes do aluguel.</p>
      </div>
      <button class="btn btn-dark d-none" id="btn-novo">Novo cliente</button>
    </div>

    <div id="alertas"></div>

    <div class="superficie table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>CPF</th>
            <th>Profissão</th>
            <th>Renda total</th>
            <th class="text-end">Ações</th>
          </tr>
        </thead>
        <tbody id="tabela"></tbody>
      </table>
    </div>
  </main>

  <!-- Modal de criação/edição -->
  <div class="modal fade" id="modal-cliente" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <form class="modal-content" id="form-cliente" novalidate>
        <div class="modal-header border-0">
          <h2 class="modal-title h5" id="modal-titulo">Cliente</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div id="erros-form"></div>
          <div data-campos></div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-dark">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/controller/clientes.js"></script>
</body>
</html>
