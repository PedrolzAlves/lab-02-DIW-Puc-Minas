<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro · AlugaCar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5" style="max-width: 640px;">
    <a href="index.html" class="small text-secondary text-decoration-none">← Voltar ao login</a>
    <h1 class="h3 fw-bold mt-3 mb-1">Criar conta</h1>
    <p class="text-secondary mb-4">O uso do sistema exige cadastro prévio como cliente.</p>

    <div id="alertas"></div>

    <form id="form-cadastro" class="superficie p-4" novalidate>
      <div data-campos></div>
      <button class="btn btn-dark w-100 mt-4" type="submit">Cadastrar</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/controller/cadastro.js"></script>
</body>
</html>
