<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automóveis · AlugaCar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container pb-5">
    <div class="page-header">
      <div>
        <h1>Automóveis</h1>
        <p>Frota disponível para aluguel e seus proprietários.</p>
      </div>
      <button class="btn btn-dark" id="btn-novo">Novo automóvel</button>
    </div>

    <div id="alertas"></div>

    <div class="superficie table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>Matrícula</th>
            <th>Placa</th>
            <th>Marca / Modelo</th>
            <th>Ano</th>
            <th>Proprietário</th>
            <th class="text-end">Ações</th>
          </tr>
        </thead>
        <tbody id="tabela"></tbody>
      </table>
    </div>
  </main>

  <div class="modal fade" id="modal-automovel" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="form-automovel" novalidate>
        <div class="modal-header border-0">
          <h2 class="modal-title h5" id="modal-titulo">Automóvel</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div id="erros-form"></div>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label" for="matricula">Matrícula</label>
              <input class="form-control" id="matricula" name="matricula" required>
            </div>
            <div class="col-6">
              <label class="form-label" for="placa">Placa</label>
              <input class="form-control text-uppercase" id="placa" name="placa" maxlength="7" required>
            </div>
            <div class="col-6">
              <label class="form-label" for="marca">Marca</label>
              <input class="form-control" id="marca" name="marca" required>
            </div>
            <div class="col-6">
              <label class="form-label" for="modelo">Modelo</label>
              <input class="form-control" id="modelo" name="modelo" required>
            </div>
            <div class="col-4">
              <label class="form-label" for="ano">Ano</label>
              <input class="form-control" id="ano" name="ano" type="number" required>
            </div>
            <div class="col-8">
              <label class="form-label" for="proprietario">Proprietário</label>
              <select class="form-select" id="proprietario" name="proprietario" required></select>
            </div>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-dark">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/controller/automoveis.js"></script>
</body>
</html>
