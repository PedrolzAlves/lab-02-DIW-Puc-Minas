<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · AlugaCar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <main class="auth">
    <!-- Espaço para imagem: coloque seu arquivo em public/img/capa.jpg -->
    <div class="img-slot">
      <span>Sua imagem aqui · img/capa.jpg</span>
      <img src="img/capa.jpg" alt="" onerror="this.remove()">
    </div>

    <section class="auth-form">
      <div>
        <h1 class="h3 fw-bold mb-1">Aluga<span class="text-accent">Car</span></h1>
        <p class="text-secondary mb-4">Entre para gerenciar seus pedidos de aluguel.</p>

        <div id="alertas"></div>

        <form id="form-login" novalidate>
          <div class="mb-3">
            <label class="form-label" for="login">Login</label>
            <input class="form-control" id="login" name="login" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label" for="senha">Senha</label>
            <input class="form-control" id="senha" name="senha" type="password" required>
          </div>
          <button class="btn btn-dark w-100" type="submit">Entrar</button>
        </form>

        <p class="text-center small text-secondary mt-4 mb-0">
          Ainda não tem conta? <a href="cadastro.html" class="text-accent">Cadastre-se</a>
        </p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/controller/login.js"></script>
</body>
</html>
